name: Deploy Supplier Platform

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'supplier-platform/**'
      - '.github/workflows/deploy-supplier.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: supplier-platform/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: supplier-platform/backend/requirements.txt

      # ========== FRONTEND DEPLOYMENT ==========
      - name: Install frontend dependencies
        working-directory: supplier-platform/frontend
        run: npm ci

      - name: Build frontend
        working-directory: supplier-platform/frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.SUPPLIER_FRONTEND_API_BASE_URL || 'https://supplier.tripsadora.com/api' }}

      - name: Deploy frontend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "supplier-platform/frontend/dist/*"
          target: "/var/www/tripsadora/supplier"
          strip_components: 3
          rm: true

      - name: Set frontend permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            sudo chown -R www-data:www-data /var/www/tripsadora/supplier
            sudo chmod -R 755 /var/www/tripsadora/supplier

      # ========== BACKEND DEPLOYMENT ==========
      - name: Install backend dependencies
        working-directory: supplier-platform/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy backend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "supplier-platform/backend/*"
          target: "/var/www/Trips-Adora/supplier-platform/backend"
          strip_components: 2
          rm: false

      - name: Setup backend on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /var/www/Trips-Adora/supplier-platform/backend
            
            # Create virtual environment if it doesn't exist
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            
            # Activate venv and install dependencies
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            # Restart the service
            sudo systemctl restart supplier-api.service
            sleep 2
            sudo systemctl status supplier-api.service --no-pager | head -15

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            echo "✅ Supplier Platform Deployment Complete!"
            echo "Frontend: https://supplier.tripsadora.com"
            echo "Backend API: https://supplier.tripsadora.com/api"

