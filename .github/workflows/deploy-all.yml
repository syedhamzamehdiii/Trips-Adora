name: Deploy All Platforms

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'customer-platform/**'
      - 'supplier-platform/**'
      - 'admin-platform/**'
      - 'nginx-*.conf'
      - '.github/workflows/deploy-all.yml'
  workflow_dispatch:

jobs:
  deploy-customer:
    name: Deploy Customer Platform
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: customer-platform/frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: customer-platform/backend/requirements.txt

      - name: Install frontend dependencies
        working-directory: customer-platform/frontend
        run: npm ci

      - name: Build frontend
        working-directory: customer-platform/frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.CUSTOMER_FRONTEND_API_BASE_URL || 'https://tripsadora.com/api' }}

      - name: Deploy frontend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "customer-platform/frontend/dist/*"
          target: "/var/www/tripsadora/customer"
          strip_components: 3
          rm: true

      - name: Set frontend permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            sudo chown -R www-data:www-data /var/www/tripsadora/customer
            sudo chmod -R 755 /var/www/tripsadora/customer

      - name: Install backend dependencies
        working-directory: customer-platform/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Deploy backend to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "customer-platform/backend/*"
          target: "/var/www/Trips-Adora/customer-platform/backend"
          strip_components: 2
          rm: false

      - name: Setup backend on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd /var/www/Trips-Adora/customer-platform/backend
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            sudo systemctl restart customer-api.service
            sleep 2
            sudo systemctl status customer-api.service --no-pager | head -15

